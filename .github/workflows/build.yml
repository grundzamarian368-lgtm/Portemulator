name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poskladat slozky
        run: |
          mkdir -p app/src/main/java/cz/padstudio
          mv app_build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv Layout.kt EditorView.kt MainActivity.kt app/src/main/java/cz/padstudio/
      - name: Stahnout jadra emulatoru
        run: |
          base=https://buildbot.libretro.com/nightly/android/latest/arm64-v8a
          d=app/src/main/jniLibs/arm64-v8a
          mkdir -p $d
          for n in mupen64plus_next_gles3 melonds desmume; do
            if curl -fsSL -o /tmp/$n.zip "$base/${n}_libretro_android.so.zip"; then
              unzip -o /tmp/$n.zip -d /tmp/core_$n
              for f in /tmp/core_$n/*.so; do cp "$f" "$d/lib$(basename $f)"; done
            else
              echo "NENALEZENO: $n"
            fi
          done
          ls -la $d
          test -n "$(ls $d)" || { echo "ZADNA JADRA"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Licence Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PadStudio-apk
          path: app/build/outputs/apk/debug/*.apk
